appId: com.openeagle.desktop
productName: openEagle
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - build/**/*
  - package.json
extraResources:
  - from: backend/
    to: backend/
    filter:
      - "**/*"
      - "!.venv"
      - "!__pycache__"
      - "!.open-eagle"
win:
  target: nsis
  icon: build/icon.ico
mac:
  target: dmg
linux:
  target: AppImage
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
