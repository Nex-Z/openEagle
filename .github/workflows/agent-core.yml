name: Agent Core v2
on:
  pull_request:
    paths: ['native/windows-uia/**', 'packages/agent-core/**', 'electron/**', 'src/**', 'scripts/verify-v2-*.cjs', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/agent-core.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headless-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @open-eagle/agent-core exec playwright install --with-deps chromium
      - run: pnpm v2:typecheck
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec tsc -p tsconfig.electron.json
      - run: node scripts/ensure-cjs-package.cjs
      - run: node --test scripts/verify-v2-gui-policy.cjs
      # OS GUI smoke requires an interactive owned window; not run on hosted CI.
      - run: pnpm v2:test

  headless-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24.8.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @open-eagle/agent-core exec playwright install chromium
      - run: pnpm v2:typecheck
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec tsc -p tsconfig.electron.json
      - run: node scripts/ensure-cjs-package.cjs
      - run: node --test scripts/verify-v2-gui-policy.cjs
      # OS GUI smoke requires an interactive owned window; not run on hosted CI.
      # Windows 显式可信工作区测试；旧 Linux-only 测试跳过不等于通过。
      - run: pnpm --filter @open-eagle/agent-core test:unit
      - run: pnpm --filter @open-eagle/agent-core test:browser
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build and self-test UIA sidecar (no OS interaction)
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
        run: |
          dotnet restore native/windows-uia/OpenEagle.Uia.csproj --locked-mode --configfile native/windows-uia/NuGet.Config
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build native/windows-uia/OpenEagle.Uia.csproj -c Release --no-restore
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & native/windows-uia/bin/Release/net10.0-windows/OpenEagle.Uia.exe --self-test
          exit $LASTEXITCODE
