name: Agent Core v2
on:
  pull_request:
    paths: ['packages/agent-core/**', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/agent-core.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headless-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @open-eagle/agent-core exec playwright install --with-deps chromium
      - run: pnpm v2:typecheck
      - run: pnpm v2:test
