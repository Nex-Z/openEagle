name: Agent Core v2
on:
  pull_request:
    paths: ['packages/agent-core/**', 'electron/**', 'src/**', 'scripts/verify-v2-*.cjs', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/agent-core.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headless-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @open-eagle/agent-core exec playwright install --with-deps chromium
      - run: pnpm v2:typecheck
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec tsc -p tsconfig.electron.json
      - run: node scripts/ensure-cjs-package.cjs
      - run: node --test scripts/verify-v2-gui-policy.cjs
      # OS GUI smoke requires an interactive owned window; not run on hosted CI.
      - run: pnpm v2:test

  headless-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24.8.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @open-eagle/agent-core exec playwright install chromium
      - run: pnpm v2:typecheck
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec tsc -p tsconfig.electron.json
      - run: node scripts/ensure-cjs-package.cjs
      - run: node --test scripts/verify-v2-gui-policy.cjs
      # OS GUI smoke requires an interactive owned window; not run on hosted CI.
      # Windows 显式可信工作区测试；旧 Linux-only 测试跳过不等于通过。
      - run: pnpm --filter @open-eagle/agent-core test:unit
      - run: pnpm --filter @open-eagle/agent-core test:browser
